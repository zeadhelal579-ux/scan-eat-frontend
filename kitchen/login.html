<!--
  FILE: kitchen/login.html
  PURPOSE: Staff sign-in for the Kitchen Display. Posts to
           POST /api/auth/login via shared/js/login-form.js and stores the
           returned JWT, per 05-FRONTEND-ARCHITECTURE.md section 3.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Login - Scan & Eat</title>
    <link rel="stylesheet" href="css/kitchen.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>🍳 Kitchen Display</h1>
            <p class="subtitle">Sign in to view incoming orders</p>

            <form id="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <div id="login-error" hidden></div>

                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/api-client.js"></script>
    <script src="../shared/js/login-form.js"></script>
    <script src="js/login-init.js"></script>
</body>
</html>
