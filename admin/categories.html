<!--
  FILE: admin/categories.html
  PURPOSE: Category management (add/edit/delete) - per
           05-FRONTEND-ARCHITECTURE.md section 4.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Scan & Eat Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="categories">
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">Scan &amp; Eat<span>ADMIN</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" data-page="dashboard">📊 Dashboard</a>
                <a href="products.html" data-page="products">🍔 Products</a>
                <a href="categories.html" data-page="categories">🗂️ Categories</a>
                <a href="offers.html" data-page="offers">🎁 Offers</a>
                <a href="tables.html" data-page="tables">🔗 Tables &amp; QR</a>
            </nav>
            <div class="sidebar-footer">
                <span id="admin-name"></span>
                <button id="logout-btn">Sign Out</button>
            </div>
        </aside>

        <main class="admin-content">
            <h1 class="page-title">Categories</h1>
            <p class="page-subtitle">The sections customers scroll through at the top of the Menu page.</p>

            <div id="demo-mode-banner" hidden><span id="demo-mode-banner-text"></span></div>

            <div class="panel">
                <div class="toolbar">
                    <span></span>
                    <button class="btn btn-primary" id="add-category-btn">+ Add Category</button>
                </div>
                <table class="data-table">
                    <thead><tr><th>Order</th><th>Name</th><th>Image</th><th></th></tr></thead>
                    <tbody id="categories-table-body"></tbody>
                </table>
                <p class="empty-state" id="categories-empty-msg" hidden>No categories yet.</p>
            </div>
        </main>
    </div>

    <div class="modal-backdrop" id="category-modal" hidden>
        <div class="modal-box">
            <h3 id="category-modal-title">Add Category</h3>
            <form id="category-form">
                <input type="hidden" id="category-id">
                <div class="form-field">
                    <label for="category-name">Name</label>
                    <input type="text" id="category-name" required>
                </div>
                <div class="form-field">
                    <label for="category-image">Image URL</label>
                    <input type="url" id="category-image" placeholder="https://...">
                </div>
                <div class="form-field">
                    <label for="category-order">Display Order</label>
                    <input type="number" id="category-order" min="1" step="1" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="category-cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="category-save-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/api-client.js"></script>
    <script src="js/admin-demo-data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
