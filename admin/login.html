<!--
  FILE: admin/login.html
  PURPOSE: Admin sign-in. Same pattern as kitchen/login.html (shared
           shared/js/login-form.js), but the demo account carries the
           Admin role, and a successful real login must also carry the
           Admin role specifically per 08-API-CONTRACT.md's Auth column -
           enforced by Auth.guardPage({requireRole:"Admin"}) on every other
           admin page, not here.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Scan & Eat</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>Scan & Eat Admin</h1>
            <p class="subtitle">Sign in to manage your restaurant</p>

            <form id="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <div id="login-error" hidden></div>

                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/api-client.js"></script>
    <script src="../shared/js/login-form.js"></script>
    <script src="js/login-init.js"></script>
</body>
</html>
